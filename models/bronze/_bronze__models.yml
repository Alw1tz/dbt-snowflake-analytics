version: 2

models:
  - name: stg_customers
    description: One row per customer, lightly cleaned (normalized email, full name).
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: One row per order, normalized status casing.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_order_items
    description: One row per order line item, with computed line_total.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
